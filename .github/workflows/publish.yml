name: Publish

# Tests, publishes the Docker image to GitHub Container Registry and creates a
# GitHub Release.
#   - Push a tag:      git tag v1.0.0 && git push origin v1.0.0
#   - Or run manually: Actions > Publish > Run workflow, with a version like 1.0.0
#     (creates the tag v1.0.0 on the selected commit).
# A manual run without a version only publishes the :edge image.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without "v" (e.g. 1.0.0). Leave empty to publish :edge only.'
        required: false
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          v=""
          if [[ "$REF" == refs/tags/v* ]]; then v="${REF_NAME#v}"; elif [[ -n "$INPUT_VERSION" ]]; then v="${INPUT_VERSION#v}"; fi
          if [[ -n "$v" && ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then echo "Invalid version: $v"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opensheet
          POSTGRES_PASSWORD: opensheet
          POSTGRES_DB: opensheet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opensheet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://opensheet:opensheet@localhost:5432/opensheet_test
      TEST_DATABASE_URL: postgresql://opensheet:opensheet@localhost:5432/opensheet_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opensheet/server exec prisma generate
      - run: pnpm typecheck
      - run: pnpm --filter @opensheet/engine test
      - run: pnpm --filter @opensheet/server test

  publish:
    needs: [meta, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.meta.outputs.version }},enable=${{ needs.meta.outputs.version != '' }}
            type=raw,value=latest,enable=${{ needs.meta.outputs.version != '' && !contains(needs.meta.outputs.version, '-') }}
            type=raw,value=edge,enable=${{ needs.meta.outputs.version == '' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [meta, publish]
    if: needs.meta.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "Release v$VERSION already exists"; exit 0; fi
          pre=""; [[ "$VERSION" == *-* ]] && pre="--prerelease"
          gh release create "v$VERSION" --target "$SHA" --title "OpenSheet $VERSION" --generate-notes $pre \
            --notes "Docker image: \`ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION\`"
